<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff5f8">
<title>Galeri Foto Acara</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@400;600;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fff5f8; --ink:#2d2230; --muted:#8c7a90; --accent:#ff5c8a; --accent2:#ffa24c;
    --card:#ffffff; --radius:18px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Poppins,system-ui,sans-serif}
  body{min-height:100dvh;padding-bottom:110px}
  header{padding:calc(env(safe-area-inset-top) + 22px) 20px 8px;text-align:center}
  header .title{font-family:Pacifico,cursive;font-size:30px;color:var(--accent);line-height:1.2}
  header .sub{font-size:13px;color:var(--muted);margin-top:4px}
  .bar{display:flex;align-items:center;justify-content:space-between;padding:10px 18px 4px;font-size:13px;color:var(--muted)}
  .bar button{border:0;background:#fff;border-radius:999px;padding:7px 14px;font:inherit;color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.08);cursor:pointer}

  /* galeri */
  .grid{column-count:2;column-gap:10px;padding:8px 12px}
  @media(min-width:700px){.grid{column-count:3}}
  @media(min-width:1000px){.grid{column-count:4}}
  .grid figure{margin:0 0 10px;break-inside:avoid;border-radius:var(--radius);overflow:hidden;background:#eee;
    box-shadow:0 4px 14px rgba(80,30,60,.12);cursor:pointer;animation:pop .35s ease both}
  .grid img{display:block;width:100%;height:auto;min-height:120px;background:linear-gradient(135deg,#ffe3ec,#fff0d9)}
  @keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
  .empty{text-align:center;color:var(--muted);padding:60px 30px;font-size:15px;line-height:1.6}
  .empty .big{font-size:56px}

  /* tombol + */
  .fab{position:fixed;right:20px;bottom:calc(env(safe-area-inset-bottom) + 22px);width:68px;height:68px;border-radius:50%;
    border:0;color:#fff;font-size:42px;line-height:1;background:linear-gradient(135deg,var(--accent),var(--accent2));
    box-shadow:0 10px 26px rgba(255,92,138,.55);cursor:pointer;z-index:20;display:grid;place-items:center;padding-bottom:4px}
  .fab:active{transform:scale(.94)}

  /* sheet pilih sumber */
  .overlay{position:fixed;inset:0;background:rgba(30,10,30,.55);display:none;z-index:40}
  .overlay.show{display:block}
  .sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:26px 26px 0 0;
    padding:22px 20px calc(env(safe-area-inset-bottom) + 22px);animation:up .25s ease}
  @keyframes up{from{transform:translateY(100%)}to{transform:none}}
  .sheet h3{margin:0 0 14px;text-align:center;font-weight:600}
  .opt{display:flex;align-items:center;gap:14px;width:100%;border:0;background:#fff5f8;border-radius:16px;padding:16px;
    font:inherit;font-size:16px;margin-bottom:10px;cursor:pointer;text-align:left}
  .opt span.i{font-size:28px}
  .opt.cancel{background:transparent;justify-content:center;color:var(--muted)}

  /* editor */
  .editor{position:fixed;inset:0;background:#1b1020;color:#fff;display:none;flex-direction:column;z-index:50}
  .editor.show{display:flex}
  .ed-top{display:flex;justify-content:space-between;align-items:center;padding:calc(env(safe-area-inset-top) + 12px) 16px 8px}
  .ed-top button{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:999px;padding:8px 16px;font:inherit;cursor:pointer}
  .ed-top .t{font-weight:600}
  .stage{flex:1;min-height:0;display:grid;place-items:center;padding:6px 16px}
  .stage canvas{max-width:100%;max-height:100%;border-radius:14px;box-shadow:0 10px 40px rgba(0,0,0,.5);background:#000}
  .tools{padding:8px 14px calc(env(safe-area-inset-bottom) + 14px);background:#241730;border-radius:22px 22px 0 0}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:6px 2px 10px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;border:2px solid transparent;background:rgba(255,255,255,.1);color:#fff;border-radius:14px;
    padding:8px 12px;font:inherit;font-size:12px;text-align:center;cursor:pointer;min-width:74px}
  .chip .e{display:block;font-size:24px;margin-bottom:2px}
  .chip.on{border-color:var(--accent);background:rgba(255,92,138,.25)}
  .row{display:flex;gap:10px;align-items:center;margin:4px 0 10px}
  .row label{font-size:12px;color:#c9b8d0;flex:0 0 52px}
  .row input[type=range]{flex:1;accent-color:var(--accent)}
  .row input[type=text]{flex:1;border:0;border-radius:12px;padding:10px 12px;font:inherit;background:rgba(255,255,255,.12);color:#fff;outline:none}
  .send{width:100%;border:0;border-radius:16px;padding:15px;font:inherit;font-weight:600;font-size:16px;color:#fff;cursor:pointer;
    background:linear-gradient(135deg,var(--accent),var(--accent2))}
  .send:disabled{opacity:.6}

  /* lightbox */
  .lb{position:fixed;inset:0;background:rgba(10,5,15,.94);display:none;z-index:60;align-items:center;justify-content:center;flex-direction:column}
  .lb.show{display:flex}
  .lb img{max-width:96vw;max-height:78dvh;border-radius:12px;object-fit:contain}
  .lb .acts{display:flex;gap:10px;margin-top:16px}
  .lb a,.lb button{background:rgba(255,255,255,.16);color:#fff;border:0;border-radius:999px;padding:10px 18px;font:inherit;text-decoration:none;cursor:pointer}
  .lb .x{position:absolute;top:calc(env(safe-area-inset-top) + 14px);right:16px}
  .lb .nav{position:absolute;top:50%;transform:translateY(-50%);font-size:26px;width:46px;height:46px;padding:0}
  .lb .prev{left:8px}.lb .next{right:8px}

  /* terkunci */
  .lock{min-height:100dvh;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;gap:12px}
  .lock .big{font-size:76px}
  .lock h2{font-family:Pacifico,cursive;color:var(--accent);margin:0;font-weight:400;font-size:28px}
  .lock p{color:var(--muted);max-width:300px;line-height:1.6;margin:0}
  .name-box{display:flex;flex-direction:column;gap:10px;width:min(100%, 360px);margin-top:8px}
  .name-box label{font-size:12px;color:var(--muted);text-align:left;font-weight:600;letter-spacing:.02em}
  .name-box input{width:100%;padding:14px 16px;border:1px solid rgba(137,84,99,.2);border-radius:14px;background:#fff;font:inherit;color:var(--ink);outline:none;box-shadow:0 4px 16px rgba(0,0,0,.04)}
  .name-box input:focus{border-color:rgba(255,92,138,.7);box-shadow:0 0 0 3px rgba(255,92,138,.12)}
  .name-box button{border:0;border-radius:14px;padding:14px 16px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font:inherit;font-weight:600;cursor:pointer}

  .toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 108px);transform:translateX(-50%) translateY(20px);
    background:#2d2230;color:#fff;padding:11px 18px;border-radius:999px;font-size:14px;opacity:0;transition:.3s;z-index:80;pointer-events:none;max-width:90vw;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%)}
  .hidden{display:none!important}
</style>
</head>
<body>

<!-- ===== Halaman terkunci (belum scan QR) ===== -->
<section class="lock" id="lock">
  <div class="big">📷</div>
  <h2>Scan dulu ya!</h2>
  <p>Untuk masuk ke galeri, scan QR code yang tersedia di lokasi acara menggunakan kamera HP Anda.</p>
  <form class="name-box" id="nameForm">
    <label for="guestName">Masukkan nama Anda</label>
    <input id="guestName" type="text" maxlength="40" placeholder="Contoh: Dicky" autocomplete="off" required>
    <button type="submit">Masuk ke Galeri</button>
  </form>
</section>

<!-- ===== Aplikasi ===== -->
<main id="app" class="hidden">
  <header>
    <div class="title" id="evName">Galeri Acara</div>
    <div class="sub" id="evDate"></div>
  </header>
  <div class="bar"><span id="count">Memuat…</span><button id="refresh">↻ Segarkan</button></div>
  <div class="grid" id="grid"></div>
  <div class="empty hidden" id="empty"><div class="big">🎞️</div>Belum ada foto.<br>Jadilah yang pertama — tekan tombol <b>+</b>!</div>
  <button class="fab" id="fab" aria-label="Tambah foto">+</button>
</main>

<!-- ===== Pilih sumber foto ===== -->
<div class="overlay" id="srcOverlay">
  <div class="sheet">
    <h3>Tambah Foto</h3>
    <button class="opt" id="optCam"><span class="i">📸</span> Ambil foto dengan kamera</button>
    <button class="opt" id="optGal"><span class="i">🖼️</span> Pilih dari galeri HP</button>
    <button class="opt cancel" id="optCancel">Batal</button>
  </div>
</div>
<input type="file" id="inCam" accept="image/*" capture="environment" class="hidden">
<input type="file" id="inGal" accept="image/*" class="hidden">

<!-- ===== Editor frame ===== -->
<div class="editor" id="editor">
  <div class="ed-top"><button id="edBack">✕ Batal</button><span class="t">Pilih Frame</span><span style="width:78px"></span></div>
  <div class="stage"><canvas id="cv" width="1080" height="1350"></canvas></div>
  <div class="tools">
    <div class="chips" id="chips"></div>
    <div class="row"><label>Zoom</label><input type="range" id="zoom" min="1" max="2.5" step="0.01" value="1"></div>
    <div class="row"><label>Pesan</label><input type="text" id="caption" maxlength="40" placeholder="Tulis pesan singkat (opsional)"></div>
    <button class="send" id="send">Kirim ke Galeri 🎉</button>
  </div>
</div>

<!-- ===== Lightbox ===== -->
<div class="lb" id="lb">
  <button class="x" id="lbClose">✕</button>
  <button class="nav prev" id="lbPrev">‹</button>
  <img id="lbImg" alt="">
  <button class="nav next" id="lbNext">›</button>
  <div class="acts"><a id="lbDl" target="_blank" rel="noopener">⬇ Unduh</a></div>
</div>

<div class="toast" id="toast"></div>

<script>
/* =====================================================
   PENGATURAN — ubah bagian ini saja
   ===================================================== */
const CONFIG = {
  EVENT_NAME: 'Dicky & Rahmanisya',
  EVENT_DATE: '17 Januari 2027',
  API_URL: 'https://script.google.com/macros/s/AKfycbzh7Bvp6tk6f-oLdEVJa3-B4-txD-QbxNmbwxEYibRtYvZzuftkx1Hy9NlSNw6NFwxurA/exec',   // hasil Deploy di Apps Script (berakhiran /exec)
  POLL_MS: 30000                              // seberapa sering galeri menyegarkan diri
};
/* ===================================================== */

const $ = id => document.getElementById(id);
const DEMO = CONFIG.API_URL.includes('PASTE_');
const W = 1080, H = 1350;
const GUEST_KEY = 'galeri_guest_name';

function normalizeGuestName(value){
  return String(value || '')
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-zA-Z0-9 ]/g, ' ')
    .replace(/\s+/g, ' ')
    .trim()
    .replace(/ /g, '_');
}

function getGuestName(){
  try {
    return normalizeGuestName(localStorage.getItem(GUEST_KEY));
  } catch (e) {
    return '';
  }
}

function setGuestName(value){
  const safe = normalizeGuestName(value);
  if (!safe) return '';
  try { localStorage.setItem(GUEST_KEY, safe); } catch (e) {}
  return safe;
}

function showGuestPrompt(){
  $('lock').style.display = 'flex';
  $('app').classList.add('hidden');
  $('nameForm').classList.remove('hidden');
  $('guestName').focus();
}

function hideGuestPrompt(){
  $('lock').style.display = 'none';
  $('app').classList.remove('hidden');
  $('nameForm').classList.add('hidden');
}

/* ---------- Akses via QR ---------- */
const params = new URLSearchParams(location.search);
let KEY = params.get('k');
try { if (KEY) localStorage.setItem('galeri_key', KEY); else KEY = localStorage.getItem('galeri_key'); } catch(e){}
if (DEMO && !KEY) KEY = 'demo';

const guestName = getGuestName();
if (!KEY) {
  $('lock').style.display = 'flex';
  $('nameForm').classList.add('hidden');
} else if (!guestName) {
  showGuestPrompt();
} else {
  hideGuestPrompt();
  init();
}

$('nameForm').addEventListener('submit', e => {
  e.preventDefault();
  const value = normalizeGuestName($('guestName').value);
  if (!value) {
    toast('Isi nama dulu ya sebelum masuk galeri.');
    $('guestName').focus();
    return;
  }
  setGuestName(value);
  hideGuestPrompt();
  init();
});

function toast(msg, ms = 2600){
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), ms);
}

/* ---------- Galeri ---------- */
let photos = [];            // {id?, src, full, dl}
let demoPhotos = [];
function init(){
  $('evName').textContent = CONFIG.EVENT_NAME;
  $('evDate').textContent = CONFIG.EVENT_DATE;
  document.title = 'Galeri · ' + CONFIG.EVENT_NAME;
  if (DEMO) toast('Mode demo: foto belum tersimpan ke Drive', 4200);
  loadList();
  setInterval(() => { if (!document.hidden && !$('editor').classList.contains('show')) loadList(true); }, CONFIG.POLL_MS);
  $('refresh').onclick = () => loadList();
}

async function loadList(silent){
  if (DEMO){ photos = demoPhotos.slice(); render(); return; }
  try{
    const r = await fetch(`${CONFIG.API_URL}?action=list&k=${encodeURIComponent(KEY)}`);
    const d = await r.json();
    if (!d.ok){
      if (/kunci/i.test(d.error||'')) { try{localStorage.removeItem('galeri_key')}catch(e){}; KEY=null; $('app').classList.add('hidden'); $('lock').style.display='flex'; return; }
      throw new Error(d.error);
    }
    photos = d.photos.map(p => ({
      id: p.id,
      src: `https://drive.google.com/thumbnail?id=${p.id}&sz=w600`,
      full: `https://drive.google.com/thumbnail?id=${p.id}&sz=w1600`,
      dl: `https://drive.google.com/uc?export=download&id=${p.id}`
    }));
    render();
  }catch(e){ if(!silent) toast('Gagal memuat galeri. Coba lagi ya.'); }
}

let rendered = '';
function render(){
  const sig = photos.map(p => p.id || p.src).join('|');
  $('count').textContent = photos.length ? `${photos.length} foto` : '';
  $('empty').classList.toggle('hidden', photos.length > 0);
  if (sig === rendered) return;
  rendered = sig;
  const g = $('grid'); g.innerHTML = '';
  photos.forEach((p, i) => {
    const f = document.createElement('figure');
    const im = new Image(); im.loading = 'lazy'; im.decoding = 'async'; im.src = p.src; im.alt = 'Foto ' + (i+1);
    f.appendChild(im); f.onclick = () => openLB(i); g.appendChild(f);
  });
}

/* ---------- Lightbox ---------- */
let lbIdx = 0;
function openLB(i){
  lbIdx = (i + photos.length) % photos.length;
  const p = photos[lbIdx];
  $('lbImg').src = p.full; $('lbDl').href = p.dl;
  $('lbDl').toggleAttribute('download', !!DEMO); if (DEMO) $('lbDl').download = 'foto.jpg';
  $('lb').classList.add('show');
}
$('lbClose').onclick = () => $('lb').classList.remove('show');
$('lbPrev').onclick = () => openLB(lbIdx - 1);
$('lbNext').onclick = () => openLB(lbIdx + 1);
let sx = 0;
$('lb').addEventListener('touchstart', e => sx = e.touches[0].clientX, {passive:true});
$('lb').addEventListener('touchend', e => { const dx = e.changedTouches[0].clientX - sx; if (Math.abs(dx) > 60) openLB(lbIdx + (dx < 0 ? 1 : -1)); });

/* ---------- Tombol + ---------- */
$('fab').onclick = () => $('srcOverlay').classList.add('show');
$('optCancel').onclick = () => $('srcOverlay').classList.remove('show');
$('srcOverlay').onclick = e => { if (e.target.id === 'srcOverlay') $('srcOverlay').classList.remove('show'); };
$('optCam').onclick = () => $('inCam').click();
$('optGal').onclick = () => $('inGal').click();
$('inCam').onchange = e => pick(e.target);
$('inGal').onchange = e => pick(e.target);

let IMG = null;
async function pick(input){
  const file = input.files && input.files[0]; input.value = '';
  if (!file) return;
  $('srcOverlay').classList.remove('show');
  try{
    IMG = ('createImageBitmap' in window)
      ? await createImageBitmap(file, { imageOrientation: 'from-image' })
      : await loadImg(file);
  }catch(e){ try{ IMG = await loadImg(file); }catch(_){ toast('Foto tidak bisa dibuka.'); return; } }
  try{ await Promise.all([document.fonts.load('60px Pacifico'), document.fonts.load('900 60px Poppins'), document.fonts.load('600 40px Poppins')]); }catch(e){}
  view.zoom = 1; $('zoom').value = 1; $('caption').value = '';
  buildChips(); $('editor').classList.add('show'); draw();
}
function loadImg(file){
  return new Promise((res, rej) => {
    const u = URL.createObjectURL(file), im = new Image();
    im.onload = () => res(im); im.onerror = rej; im.src = u;
  });
}

/* =====================================================
   FRAME — digambar langsung di canvas (semua orisinal)
   ===================================================== */
const view = { zoom: 1 };
const FB = 'Poppins, system-ui, sans-serif', FH = 'Pacifico, "Brush Script MT", cursive';
const EMO = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';

function rnd(seed){ return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function rr(c,x,y,w,h,r){ c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }
function cover(c,img,x,y,w,h,r=0){
  c.save(); rr(c,x,y,w,h,r); c.clip();
  const s = Math.max(w/img.width, h/img.height) * view.zoom, dw = img.width*s, dh = img.height*s;
  c.drawImage(img, x+(w-dw)/2, y+(h-dh)/2, dw, dh); c.restore();
}
function emo(c,ch,x,y,size,rot=0,glow){
  c.save(); c.translate(x,y); c.rotate(rot*Math.PI/180); c.font = `${size}px ${EMO}`; c.textAlign='center'; c.textBaseline='middle';
  if (glow){ c.shadowColor = glow; c.shadowBlur = 14; }
  c.fillText(ch,0,0); c.restore();
}
function txt(c,t,x,y,size,color,font=FB,o={}){
  if (!t) return;
  c.save(); const wt = o.weight ? o.weight + ' ' : '';
  let s = size; c.font = `${wt}${s}px ${font}`;
  const maxW = o.maxW || 900; while (c.measureText(t).width > maxW && s > 20){ s -= 2; c.font = `${wt}${s}px ${font}`; }
  c.textAlign = 'center'; c.textBaseline = 'middle';
  if (o.glow){ c.shadowColor = o.glow; c.shadowBlur = 30; }
  if (o.stroke){ c.lineWidth = o.strokeW || 12; c.lineJoin = 'round'; c.strokeStyle = o.stroke; c.strokeText(t,x,y); }
  c.fillStyle = color; c.fillText(t,x,y); c.restore();
}
function tape(c,x,y,rot){ c.save(); c.translate(x,y); c.rotate(rot*Math.PI/180); c.fillStyle='rgba(255,214,102,.78)'; c.fillRect(-85,-26,170,52); c.restore(); }
const cap = m => m.caption || m.title;

const FRAMES = [
  { id:'plain', name:'Polos', e:'🖼️', draw(c,img,m){ cover(c,img,0,0,W,H); } },

  { id:'polaroid', name:'Polaroid', e:'📸', draw(c,img,m){
    c.fillStyle='#e9e2d3'; c.fillRect(0,0,W,H);
    c.save(); c.shadowColor='rgba(0,0,0,.3)'; c.shadowBlur=40; c.shadowOffsetY=16; c.fillStyle='#fff'; c.fillRect(70,70,940,1210); c.restore();
    cover(c,img,115,115,850,880);
    tape(c,200,82,-8); tape(c,880,82,9);
    txt(c,cap(m),W/2,1115,72,'#3a3340',FH);
    txt(c,m.date,W/2,1205,38,'#9a8f9e',FB);
  }},

  { id:'cute', name:'Pink Imut', e:'🎀', draw(c,img,m){
    const g=c.createLinearGradient(0,0,W,H); g.addColorStop(0,'#ffd9ea'); g.addColorStop(1,'#ffb0d0'); c.fillStyle=g; c.fillRect(0,0,W,H);
    c.fillStyle='#fff';
    for(let x=0;x<=W;x+=62){ c.beginPath(); c.arc(x,0,36,0,7); c.fill(); c.beginPath(); c.arc(x,H,36,0,7); c.fill(); }
    for(let y=0;y<=H;y+=62){ c.beginPath(); c.arc(0,y,36,0,7); c.fill(); c.beginPath(); c.arc(W,y,36,0,7); c.fill(); }
    txt(c,m.title,W/2,120,76,'#d6336c',FH);
    c.save(); c.shadowColor='rgba(214,51,108,.35)'; c.shadowBlur=30; c.shadowOffsetY=10; c.fillStyle='#fff'; rr(c,82,192,916,916,70); c.fill(); c.restore();
    cover(c,img,100,210,880,880,56);
    emo(c,'🎀',105,215,130,-22); emo(c,'💖',985,1100,110,14);
    for(let i=0;i<7;i++) emo(c,i%2?'💗':'💕',150+i*130,1175+(i%2)*14,54,(i%2?8:-8));
    txt(c,m.caption||m.date,W/2,1262,64,'#b3245a',FH);
  }},

  { id:'neon', name:'Neon', e:'🌃', draw(c,img,m){
    c.fillStyle='#12002b'; c.fillRect(0,0,W,H);

let frameIdx = 1;
function buildChips(){
  const box = $('chips'); box.innerHTML = '';
  FRAMES.forEach((f,i) => {
    const b = document.createElement('button'); b.className = 'chip' + (i === frameIdx ? ' on' : '');
    b.innerHTML = `<span class="e">${f.e}</span>${f.name}`;
    b.onclick = () => { frameIdx = i; [...box.children].forEach((x,j) => x.classList.toggle('on', j === i)); draw(); };
    box.appendChild(b);
  });
}
function draw(){
  if (!IMG) return;
  const cv = $('cv'), c = cv.getContext('2d');
  c.clearRect(0,0,W,H);
  FRAMES[frameIdx].draw(c, IMG, { title: CONFIG.EVENT_NAME, date: CONFIG.EVENT_DATE, caption: $('caption').value.trim() });
}
$('zoom').oninput = e => { view.zoom = +e.target.value; draw(); };
$('caption').oninput = draw;
$('edBack').onclick = () => $('editor').classList.remove('show');

/* ---------- Kirim ke Google Drive ---------- */
$('send').onclick = async () => {
  const btn = $('send'); btn.disabled = true; btn.textContent = 'Mengunggah…';
  try{
    const blob = await new Promise(res => $('cv').toBlob(res, 'image/jpeg', 0.86));
    if (DEMO){
      const url = URL.createObjectURL(blob);
      demoPhotos.unshift({ src: url, full: url, dl: url });
      $('editor').classList.remove('show'); toast('Foto masuk galeri (mode demo) 🎉'); loadList(); return;
    }
    const guestName = getGuestName();
    if (!guestName) {
      toast('Isi nama dulu ya sebelum upload foto.');
      showGuestPrompt();
      return;
    }
    const b64 = await new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(',')[1]); fr.onerror = rej; fr.readAsDataURL(blob); });
    const r = await fetch(CONFIG.API_URL, { method: 'POST', body: JSON.stringify({ k: KEY, name: guestName, data: b64 }) }); // text/plain → tanpa preflight CORS
    const d = await r.json();
    if (!d.ok) throw new Error(d.error || 'Gagal');
    $('editor').classList.remove('show'); toast('Foto terkirim! Terima kasih 🎉');
    loadList(true); setTimeout(() => loadList(true), 3500);
  }catch(e){
    toast(e.message || 'Gagal mengirim: cek koneksi', 3600);
  }finally{ btn.disabled = false; btn.textContent = 'Kirim ke Galeri 🎉'; }
};
